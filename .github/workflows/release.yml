name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller docx2md.spec --clean

      - name: Package release
        run: |
          mkdir release
          copy dist\docx2md.exe release\
          copy README_CN.md release\README.md
          Compress-Archive -Path release\* -DestinationPath docx2md-windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: docx2md-windows.zip
          body: |
            ## 使用方式

            1. 下载 `docx2md.exe`
            2. 双击运行，自动打开浏览器
            3. 上传 `.docx` 文件，转换完成后自动下载

            ## 校验

            | 文件 | 大小 |
            |------|------|
            | docx2md.exe | ~19 MB |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
