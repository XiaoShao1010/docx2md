name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller docx2md.spec --clean

      - name: Package release
        run: |
          mkdir release
          copy dist\docx2md.exe release\
          copy README_CN.md release\README.md
          Compress-Archive -Path release\* -DestinationPath docx2md-windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: docx2md-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
